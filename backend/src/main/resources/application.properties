spring.application.name=last-mile-delivery-tracker

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/lastmile_tracker}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET:your-256-bit-secret-key-change-this-in-production-environment}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Server
server.port=8080
